name: Update Google Scholar Citations

# Refreshes _data/scholar.yml weekly so the citation count on the publications
# page does not go stale. Scholar rate-limits datacenter IPs and sometimes
# answers with a CAPTCHA, so a failed scrape is expected occasionally and is
# treated as a no-op rather than a build failure.
on:
  schedule:
    - cron: "0 6 * * 1" # Mondays, 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source branch
        uses: actions/checkout@v5
        with:
          # Scheduled runs default to the repository's default branch, which
          # holds the generated site. The Jekyll source lives on "source".
          ref: source

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch citation metrics
        id: fetch
        continue-on-error: true
        run: python3 bin/fetch_scholar.py

      - name: Commit refreshed count
        if: steps.fetch.outcome == 'success'
        run: |
          if git diff --quiet -- _data/scholar.yml; then
            echo "Citation count unchanged; nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _data/scholar.yml
          git commit -m "chore: update Google Scholar citation count [ci skip]"
          git push origin source

      - name: Report a blocked scrape
        if: steps.fetch.outcome != 'success'
        run: echo "::warning::Scholar scrape failed (likely a CAPTCHA); keeping the previous count."

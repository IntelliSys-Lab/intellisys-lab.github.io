<!-- Back to top: appears after scrolling one screen down, so only on long pages -->
<button type="button" class="back-to-top" aria-label="Back to top" title="Back to top">
  <i class="fas fa-arrow-up" aria-hidden="true"></i>
</button>
<script>
(function () {
  var button = document.querySelector('.back-to-top');
  if (!button) return;
  var reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
  function update() {
    button.classList.toggle('is-visible', window.scrollY > window.innerHeight);
  }
  window.addEventListener('scroll', update, { passive: true });
  window.addEventListener('resize', update);
  update();
  button.addEventListener('click', function () {
    window.scrollTo({ top: 0, behavior: reduceMotion.matches ? 'auto' : 'smooth' });
  });
})();
</script>
